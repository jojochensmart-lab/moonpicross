<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>MoonPicross Studio</title>
<style>
body{font:16px system-ui;background:#f6f7fb;color:#20233a;margin:3rem auto;max-width:34rem;padding:0 1rem}
#board{display:grid;grid-template-columns:repeat(6,2.6rem);gap:.25rem;margin:1rem 0}
#board>*{display:grid;place-items:center;height:2.6rem}
.cell{border:1px solid #8a91a7;background:white;border-radius:4px}
.cell.on{background:#324884;color:white} button{cursor:pointer}
</style>
<h1>MoonPicross Studio</h1>
<div id="board" aria-label="5 by 5 puzzle"></div>
<button id="solve">Solve with MoonBit</button><p id="result" aria-live="polite"></p>
<script src="engine.js"></script><script src="app.js"></script></html>
