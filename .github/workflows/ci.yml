name: MoonPicross CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          (Join-Path $env:USERPROFILE '.moon/bin') >> $env:GITHUB_PATH
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record candidate revision and runtime versions
        run: |
          git rev-parse HEAD
          moon version
          python --version
          node --version
      - run: python tests/oracle.py
      - run: moon fmt --check
      - run: moon check --target wasm-gc
      - run: moon build --target wasm-gc
      - run: moon test --target wasm-gc
      - run: moon test --target js
      - run: moon run examples/solve --target wasm-gc
      - run: moon run examples/generate --target wasm-gc
      - run: moon run examples/unique --target wasm-gc
      - run: moon run demo --target wasm-gc --release
      - name: Independently certify generation witnesses
        shell: pwsh
        run: |
          moon run demo --target wasm-gc --release -- stability > _build/stability.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/stability_audit.py _build/stability.csv
      - run: node scripts/build-studio.mjs
      - run: node scripts/test-studio.mjs
      - name: Offline Edge integration test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-studio-edge.ps1
      - name: Edge file selection and disk download
        if: runner.os == 'Windows'
        run: node scripts/test-studio-files.mjs
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows Native
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon build --target native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          moon test --target native
      - run: moon package --list
      - run: python tests/package_smoke.py
      - name: Prepare release evidence
        shell: pwsh
        run: |
          $label = if ($env:RUNNER_OS -eq 'Windows') { 'windows' } else { 'linux' }
          python -X utf8 scripts/release-evidence.py prepare --label $label --raw _build/publish/jojochensmart-lab-moonpicross-0.2.0.zip --out _build/release-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 tests/package_smoke.py --canonical "_build/release-evidence/$label-v020-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RUNNER_OS -eq 'Linux') {
            $env:MOONPICROSS_EDGE = (Get-Command google-chrome -ErrorAction Stop).Source
          }
          python -X utf8 scripts/release-evidence.py verify-studio "_build/release-evidence/$label-v020-studio.zip"
          exit $LASTEXITCODE
      - name: Upload verified release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-v020-release-evidence
          path: _build/release-evidence/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
